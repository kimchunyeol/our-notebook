<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 공책">
<meta name="theme-color" content="#F2F4F8">
<title>우리 둘의 공책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #F2F4F8; --sheet: #FFFFFF; --ink: #1E2640; --ink-soft: #5C6684;
  --line: #DCE1EC; --pen: #3D4FB8; --pen-soft: #E6E9F8; --rose: #C2577A; --rose-soft: #F8E6EC; --danger: #B3364A;
  --f-letter: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12151F; --sheet: #1B2030; --ink: #E7EAF4; --ink-soft: #9AA3BF;
    --line: #2C3347; --pen: #93A2F2; --pen-soft: #262D4A; --rose: #EE93B2; --rose-soft: #3A2430; --danger: #F08A9A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.6;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 22px;
}
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-letter); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-soft); font-size: 0.9rem; margin: 2px 0 0; }
.who { font-size: 0.85rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }

/* 디데이 */
.dday { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
.dd-main { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.dd-label { margin: 0; font-size: 0.85rem; color: var(--ink-soft); letter-spacing: 0.04em; }
.dd-num { margin: 0; font-family: var(--f-letter); font-weight: 700; font-size: 2.6rem; line-height: 1.15; color: var(--rose); font-variant-numeric: tabular-nums; }
.dd-unit { font-size: 1.2rem; margin-left: 4px; color: var(--ink); }
.dd-since { margin: 0; font-size: 0.82rem; color: var(--ink-soft); }
.dd-next { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.dd-next li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.9rem; }
.dd-next .nm { min-width: 0; overflow-wrap: anywhere; }
.dd-next .dt { color: var(--ink-soft); font-size: 0.78rem; margin-left: 6px; }
.dd-next .cnt { font-weight: 700; color: var(--pen); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dd-next .today .cnt { color: var(--rose); }
.dd-foot { display: flex; justify-content: flex-end; }
.dd-edit { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.dd-edit input[type="date"] { font-family: var(--f-ui); }
.dd-list { display: flex; flex-direction: column; gap: 6px; }
.dd-list .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.9rem; }
.dd-list .item span { min-width: 0; overflow-wrap: anywhere; }
.dd-add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.dd-add .dd-check, .dd-add button { grid-column: span 2; }
@media (max-width: 420px) { .dd-add { grid-template-columns: 1fr; } .dd-add .dd-check, .dd-add button { grid-column: auto; } }
.dd-check { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-soft); }
.presence { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--ink-soft); margin-top: -8px; }
.presence .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.presence.on .dot { background: #2FA36B; box-shadow: 0 0 0 3px rgba(47,163,107,.2); }
.presence.on { color: var(--ink); }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--ink-soft); }
.field input {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 10px; padding: 10px 12px; font-family: var(--f-ui); font-size: 1rem;
}
.compose input.t, .compose textarea { width: 100%; border: 0; background: transparent; color: var(--ink); font-family: var(--f-letter); outline: none; }
.compose input.t { font-size: 1.15rem; font-weight: 700; padding: 2px 0; }
.compose textarea {
  font-size: 1.05rem; line-height: 2rem; min-height: 8rem; resize: vertical;
  background-image: linear-gradient(to bottom, transparent calc(2rem - 1px), var(--line) calc(2rem - 1px));
  background-size: 100% 2rem; background-attachment: local;
}
.compose input.t::placeholder, .compose textarea::placeholder { color: var(--ink-soft); opacity: .7; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row-l { display: flex; align-items: center; gap: 10px; }
.count { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
button { font-family: var(--f-ui); font-size: 0.9rem; font-weight: 500; cursor: pointer; border-radius: 999px; padding: 8px 18px; border: 1px solid transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .photo-btn:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }
.primary { background: var(--pen); color: var(--sheet); }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); padding: 5px 12px; font-size: 0.8rem; }
.ghost:hover { color: var(--ink); }
.danger { color: var(--danger); }
.err { color: var(--danger); font-size: 0.88rem; margin: 0; }

/* 사진 넣기 버튼 */
.photo-btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.8rem;
}
.photo-btn:hover { color: var(--ink); }
.photo-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.photo-btn svg { width: 16px; height: 16px; }

/* 사진 모음 */
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.pics.one { grid-template-columns: 1fr; }
.pics.one .pic { aspect-ratio: auto; max-height: 420px; }
.pic {
  position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
  background: var(--pen-soft); border: 0; padding: 0; cursor: zoom-in; max-width: 100%;
}
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pics.one .pic img { height: auto; max-height: 420px; object-fit: contain; background: var(--paper); }
.pic .x {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 24px; text-align: center;
}
.pic.loading::after { content: "불러오는 중"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.75rem; color: var(--ink-soft); }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: transparent; border-color: var(--line); color: var(--ink-soft); padding: 6px 14px; }
.tabs button[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--rose); color: var(--sheet); font-size: 0.72rem; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }

.day { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--ink-soft); margin: 8px 0 -8px 2px; }
.list { display: flex; flex-direction: column; gap: 14px; }
.letter { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px 22px; position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.letter::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 2px; border-radius: 2px; background: var(--pen); }
.letter.them::before { background: var(--rose); }
.letter.unread { border-color: var(--rose); }
/* 목록 한 줄 */
.letter:not(.open) { padding-block: 12px; }
.letter:not(.open)::before { top: 12px; bottom: 12px; }
.sum {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-width: 0;
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "top chev" "title chev" "info chev";
  column-gap: 10px; row-gap: 2px; align-items: center;
}
.sum:focus-visible { outline: 2px solid var(--pen); outline-offset: 4px; border-radius: 8px; }
.sum-top { grid-area: top; font-size: 0.8rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sum-top .name { color: var(--ink); font-weight: 500; }
.sum-title { grid-area: title; font-family: var(--f-letter); font-weight: 700; font-size: 1.08rem; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-title.plain { font-weight: 400; font-size: 1rem; }
.letter.open .sum-title { white-space: normal; overflow-wrap: anywhere; font-size: 1.15rem; }
.letter.open .sum-title.plain { display: none; }
.sum-info { grid-area: info; font-size: 0.76rem; color: var(--ink-soft); display: flex; gap: 10px; }
.sum-info:empty { display: none; }
.chev { grid-area: chev; width: 9px; height: 9px; border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .15s; }
.letter.open .chev { transform: rotate(-135deg); margin: 4px 4px 0 0; }
.tabs .expand { margin-left: auto; border-color: transparent; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.meta { font-size: 0.8rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.meta .name { color: var(--ink); font-weight: 500; }
.chip { background: var(--rose-soft); color: var(--rose); border-radius: 999px; padding: 0 8px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; }
.letter h2 { font-family: var(--f-letter); font-size: 1.15rem; margin: 0; }
.letter .body { font-family: var(--f-letter); font-size: 1.02rem; line-height: 1.95; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.replies { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.reply { font-size: 0.9rem; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply .rn { font-weight: 500; margin-right: 6px; }
.reply .rt { color: var(--ink-soft); font-size: 0.75rem; margin-left: 6px; }
.reply .chip { margin-left: 6px; }
.reply-form { display: flex; gap: 8px; }
.reply-form input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-family: var(--f-ui); font-size: 0.9rem; }
.confirm { font-size: 0.85rem; color: var(--danger); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.empty { text-align: center; color: var(--ink-soft); padding: 32px 12px; font-family: var(--f-letter); font-size: 1.05rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 0.88rem; z-index: 30; max-width: calc(100% - 32px); }

/* 사진 크게 보기 */
.viewer {
  position: fixed; inset: 0; z-index: 40; background: rgba(8,10,16,.92);
  display: grid; place-items: center; cursor: zoom-out;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.viewer button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.15); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>우리 둘의 공책</h1>
      <p class="sub">하루 있었던 일, 하고 싶은 말을 적어 두면 서로 읽을 수 있어요.</p>
    </div>
    <div class="who" id="who" hidden><span id="meName"></span><button type="button" class="ghost" id="logout">나가기</button></div>
  </header>

  <!-- 1) 로그인 화면 -->
  <form class="card" id="loginBox" hidden>
    <label class="field">이메일<input id="email" type="email" autocomplete="username" required></label>
    <label class="field">비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <button type="submit" class="primary">공책 열기</button>
  </form>

  <!-- 2) 처음 한 번: 이름 정하기 -->
  <form class="card" id="nameBox" hidden>
    <label class="field">공책에서 뭐라고 불러 드릴까요?<input id="nameIn" maxlength="20" placeholder="예: 소열" required autocomplete="off"></label>
    <button type="submit" class="primary">이 이름으로 시작</button>
  </form>

  <!-- 3) 공책 -->
  <div id="app" hidden style="display:flex;flex-direction:column;gap:22px">
    <div class="presence" id="presence" hidden><span class="dot" id="presenceDot"></span><span id="presenceText"></span></div>

    <!-- 디데이 -->
    <section class="dday" id="dday">
      <div class="dd-main" id="ddMain">
        <p class="dd-label">우리 만난 지</p>
        <p class="dd-num"><span id="ddDays">–</span><span class="dd-unit">일</span></p>
        <p class="dd-since" id="ddSince">처음 만난 날을 정해 주세요</p>
      </div>
      <ul class="dd-next" id="ddNext"></ul>
      <div class="dd-foot"><button type="button" class="ghost" id="ddToggle" aria-expanded="false">기념일 정하기</button></div>
      <div class="dd-edit" id="ddEdit" hidden>
        <label class="field">처음 만난 날<input type="date" id="ddStart"></label>
        <div class="dd-list" id="ddList"></div>
        <div class="dd-add">
          <label class="field">기념일 이름<input id="ddName" maxlength="20" placeholder="예: 여리 생일" autocomplete="off"></label>
          <label class="field">날짜<input type="date" id="ddDate"></label>
          <label class="dd-check"><input type="checkbox" id="ddYearly" checked> 매년 돌아와요</label>
          <button type="button" class="primary" id="ddAddBtn">기념일 추가</button>
        </div>
      </div>
    </section>
    <form class="card compose" id="compose">
      <input class="t" id="titleIn" maxlength="80" placeholder="제목 (안 써도 돼요)" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other">
      <textarea id="bodyIn" maxlength="5000" placeholder="오늘 하고 싶은 말을 적어 보세요" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other"></textarea>
      <div class="pics" id="pending" hidden></div>
      <div class="row">
        <div class="row-l">
          <label class="photo-btn" id="photoBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
            사진 넣기
            <input type="file" id="photoIn" accept="image/*" multiple>
          </label>
          <span class="count" id="count">0 / 5000</span>
        </div>
        <div class="row-l">
          <button type="button" class="ghost" id="cancelEdit" hidden>수정 취소</button>
          <button type="submit" class="primary" id="saveBtn" disabled>남기기</button>
        </div>
      </div>
    </form>
    <div class="tabs" role="group" aria-label="보기">
      <button type="button" data-f="all" aria-pressed="true">모두</button>
      <button type="button" data-f="me" aria-pressed="false">내가 쓴 글</button>
      <button type="button" data-f="them" aria-pressed="false">받은 글<span class="badge" id="unreadBadge" hidden></span></button>
      <button type="button" class="expand" id="expandAll" hidden>모두 펼치기</button>
    </div>
    <div class="list" id="list"><div class="empty">공책을 펼치는 중이에요…</div></div>
  </div>

  <div class="card" id="setupMsg" hidden>
    <p style="margin:0">아직 Firebase 설정이 들어가 있지 않아요. <b>index.html</b> 안의 <b>firebaseConfig</b> 부분을 채워 주세요.</p>
  </div>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="크게 본 사진"><button type="button" id="viewerClose">닫기</button></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
// ================================================================
//  Firebase 연결 값
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyC3pbL5U-n6IHLCbDOHN6ARcCbuyJPuz70",
  authDomain: "you-and-i-9996f.firebaseapp.com",
  projectId: "you-and-i-9996f",
  storageBucket: "you-and-i-9996f.firebasestorage.app",
  messagingSenderId: "361166970139",
  appId: "1:361166970139:web:f64cb0bfd3041aea0287be"
};
// ================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, onSnapshot, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const show = (id) => ["loginBox", "nameBox", "app", "setupMsg"].forEach((x) => { if ($(x)) $(x).hidden = x !== id; });

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
setPersistence(auth, browserLocalPersistence).catch(() => {});

const MAX_PHOTOS = 4;
let me = null, people = {}, letters = [], replies = [], filter = "all";
let editingId = null, confirmId = null, loaded = false, unsubs = [];
let pending = [];            // 아직 올리지 않은 사진 (dataURL)
const photoCache = {};       // 사진 id → dataURL
let seenBefore = 0;          // 이번에 열기 전 마지막으로 본 시각
let firstLetters = true, firstReplies = true;

function toast(msg, ms = 2400) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms); }
const tms = (ts) => (ts && ts.toMillis ? ts.toMillis() : Date.now());
const fmtDay = (m) => new Date(m).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
const fmtTime = (m) => new Date(m).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
const nameOf = (uid) => (people[uid] && people[uid].name) || (uid === me?.uid ? "나" : "그 사람");

// ---- 읽음 표시 (이 기기에만 저장) ----
const seenKey = () => "nb-seen-" + me.uid;
function loadSeen() { try { return Number(localStorage.getItem(seenKey())) || 0; } catch (e) { return 0; } }
function markSeenNow() { if (!me) return; try { localStorage.setItem(seenKey(), String(Date.now())); } catch (e) {} }
// 공책을 닫거나 다른 앱으로 넘어갈 때 "여기까지 읽음"으로 기록
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") markSeenNow(); });
window.addEventListener("pagehide", markSeenNow);
const isNew = (item) => item.author !== me.uid && item.createdAt && tms(item.createdAt) > seenBefore;

// ---- 지금 들어와 있는지 (접속 표시) ----
// 공책을 보고 있는 동안 1분마다 "여기 있어요"를 기록하고, 닫으면 "나갔어요"를 기록
const BEAT_MS = 60 * 1000;
const isHere = (p) => !!(p && p.here && p.lastActive && Date.now() - tms(p.lastActive) < 3 * BEAT_MS);
let beatTimer = null;
function heartbeat() {
  clearInterval(beatTimer);
  if (!me) return;
  // leftBy: 어떻게 나갔는지 — "logout"(나가기 버튼) / "close"(공책을 닫거나 다른 앱으로)
  const write = (here, leftBy) => setDoc(doc(db, "people", me.uid),
    { here, leftBy: here ? "" : (leftBy || "close"), lastActive: serverTimestamp() }, { merge: true }).catch(() => {});
  if (document.visibilityState === "visible") write(true);
  beatTimer = setInterval(() => { if (me && document.visibilityState === "visible") write(true); }, BEAT_MS);
  heartbeat.write = write;
}
document.addEventListener("visibilitychange", () => {
  if (!me || !heartbeat.write) return;
  heartbeat.write(document.visibilityState === "visible");
});
function ago(m) {
  const s = Math.max(0, Math.round((Date.now() - m) / 1000));
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "일 전";
  return new Date(m).toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
}
// 상대방이 들어오고 나가는 순간을 알려 주기
const wasHere = {};          // uid → 지난번에 들어와 있었는지
let presenceReady = false;   // 처음 화면을 열 때는 알리지 않음
function checkComings() {
  if (!me) return;
  for (const [id, p] of Object.entries(people)) {
    if (id === me.uid || !p.name) continue;
    const now = isHere(p), before = wasHere[id];
    if (presenceReady && before !== undefined && now !== before) {
      if (now) alertPerson(p.name + "님이 공책에 들어왔어요");
      else if (p.leftBy === "logout") alertPerson(p.name + "님이 '나가기'를 눌러 공책에서 나갔어요");
      else if (!p.here) alertPerson(p.name + "님이 공책을 나갔어요");
      else alertPerson(p.name + "님 연결이 끊겼어요. 공책을 나간 것 같아요");
    }
    wasHere[id] = now;
  }
  presenceReady = true;
}
// 알림: 화면 아래 안내 + 다른 탭을 보고 있으면 탭 제목도 바꿔 줌
let titleTimer = null;
function alertPerson(msg) {
  toast(msg, 6000);
  if (document.visibilityState !== "visible") {
    clearInterval(titleTimer);
    let flip = false;
    titleTimer = setInterval(() => { document.title = (flip = !flip) ? "🔔 " + msg : "우리 둘의 공책"; }, 1500);
  }
}

function drawPresence() {
  if (!me) return;
  checkComings();
  const other = Object.entries(people).find(([id, p]) => id !== me.uid && p.name);
  const box = $("presence");
  if (!other) {
    box.hidden = false; box.classList.remove("on");
    $("presenceText").textContent = "아직 상대방이 공책에 들어오지 않았어요";
    return;
  }
  const p = other[1];
  box.hidden = false;
  if (isHere(p)) { box.classList.add("on"); $("presenceText").textContent = p.name + "님이 지금 공책을 보고 있어요"; }
  else {
    box.classList.remove("on");
    $("presenceText").textContent = p.lastActive
      ? p.name + "님 마지막 접속 " + ago(tms(p.lastActive)) + (p.leftBy === "logout" ? " · 나가기를 눌렀어요" : "")
      : p.name + "님은 아직 접속 기록이 없어요";
  }
}

// 두 사람이 같이 쓰는 기념일 정보: settings/couple 문서 하나에 { startDate, events:[{id,name,date,yearly}] }
let couple = { startDate: "", events: [] };
const DAY = 86400000;
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function today0() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const diffDays = (a, b) => Math.round((b - a) / DAY);   // 날짜 차이 (서머타임 없는 한국 기준)
const fmtShort = (d) => d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
function nextYearly(base, from) {
  let d = new Date(from.getFullYear(), base.getMonth(), base.getDate());
  if (base.getMonth() === 1 && base.getDate() === 29 && d.getMonth() !== 1) d = new Date(from.getFullYear(), 1, 28);
  if (d < from) d = new Date(from.getFullYear() + 1, base.getMonth(), base.getDate());
  return d;
}
const coupleRef = () => doc(db, "settings", "couple");

function upcoming() {
  const t = today0(), out = [];
  const start = parseYMD(couple.startDate);
  if (start) {
    const dayN = diffDays(start, t) + 1;               // 만난 날 = 1일
    // 다음 100일 단위
    const next100 = Math.max(100, Math.ceil(dayN / 100) * 100);
    const d100 = new Date(start.getTime()); d100.setDate(d100.getDate() + next100 - 1);
    out.push({ name: next100 + "일", date: d100 });
    // 다음 주년
    let yrs = Math.max(1, t.getFullYear() - start.getFullYear());
    let ann = new Date(start.getFullYear() + yrs, start.getMonth(), start.getDate());
    while (ann < t) { yrs++; ann = new Date(start.getFullYear() + yrs, start.getMonth(), start.getDate()); }
    out.push({ name: yrs + "주년", date: ann });
  }
  for (const e of couple.events || []) {
    const base = parseYMD(e.date); if (!base) continue;
    const d = e.yearly ? nextYearly(base, t) : base;
    out.push({ name: e.name, date: d, past: !e.yearly && d < t });
  }
  return out
    .filter((x) => !x.past)
    .sort((a, b) => a.date - b.date)
    .slice(0, 4);
}

function drawDday() {
  const t = today0(), start = parseYMD(couple.startDate);
  if (start && start <= t) {
    $("ddDays").textContent = (diffDays(start, t) + 1).toLocaleString("ko-KR");
    $("ddSince").textContent = fmtShort(start) + "부터";
  } else if (start) {
    $("ddDays").textContent = "D-" + diffDays(t, start);
    $("ddSince").textContent = fmtShort(start) + "에 만나요";
  } else {
    $("ddDays").textContent = "–";
    $("ddSince").textContent = "아래 '기념일 정하기'에서 처음 만난 날을 정해 주세요";
  }
  const ul = $("ddNext"); ul.replaceChildren();
  for (const x of upcoming()) {
    const n = diffDays(t, x.date);
    const li = el("li", n === 0 ? "today" : null);
    const left = el("span", "nm", x.name); left.append(el("span", "dt", x.date.toLocaleDateString("ko-KR", { month: "long", day: "numeric" })));
    li.append(left, el("span", "cnt", n === 0 ? "오늘이에요" : "D-" + n));
    ul.append(li);
  }
  ul.hidden = ul.children.length === 0;

  // 편집 칸
  if (document.activeElement !== $("ddStart")) $("ddStart").value = couple.startDate || "";
  const list = $("ddList"); list.replaceChildren();
  for (const e of couple.events || []) {
    const row = el("div", "item");
    row.append(el("span", null, e.name + " · " + e.date.replace(/-/g, ".") + (e.yearly ? " (매년)" : "")));
    const x = el("button", "ghost", "빼기"); x.type = "button";
    x.onclick = () => saveCouple({ events: (couple.events || []).filter((v) => v.id !== e.id) });
    row.append(x); list.append(row);
  }
}

}

  }, denied));

  unsubs.push(onSnapshot(coupleRef(), (snap) => {

    drawDday();
  }, () => { drawDday(); }));

  unsubs.push(onSnapshot(query(collection(db, "letters"), orderBy("createdAt", "desc"), limit(500)), (snap) => {

// ---- 사진 줄이기: 휴대폰 사진을 긴 쪽 1600px 안쪽, 약 0.7MB 이하로 ----
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 0); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("읽을 수 없는 사진")); };
    img.src = url;
  });
}
async function shrink(file) {
  const img = await loadImage(file);
  let max = 1600, q = 0.8, out = "";
  for (let i = 0; i < 7; i++) {
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * s));
    c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length < 700000) break;
    max = Math.round(max * 0.8); q = Math.max(0.55, q - 0.07);
  }
  return out;
}

$("photoIn").addEventListener("change", async (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  const room = MAX_PHOTOS - pending.length;
  if (room <= 0) { toast("사진은 한 글에 " + MAX_PHOTOS + "장까지 넣을 수 있어요"); return; }
  if (files.length > room) toast("사진은 한 글에 " + MAX_PHOTOS + "장까지라서 " + room + "장만 넣었어요");
  for (const f of files.slice(0, room)) {
    try { pending.push(await shrink(f)); }
    catch (err) { toast("이 사진은 열 수 없어요. 다른 사진으로 해 보세요."); }
  }
  drawPending(); updateCount();
});

function drawPending() {
  const box = $("pending");
  box.replaceChildren();
  box.hidden = pending.length === 0;
  pending.forEach((src, i) => {
    const d = el("div", "pic");
    const img = el("img"); img.src = src; img.alt = "넣을 사진 " + (i + 1);
    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "이 사진 빼기");
    x.onclick = () => { pending.splice(i, 1); drawPending(); updateCount(); };
    d.append(img, x); box.append(d);
  });
}

$("compose").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("titleIn").value.trim(), body = $("bodyIn").value.trim();
  if ((!body && !pending.length) || !me) return;
  $("saveBtn").disabled = true;
  try {
    if (editingId) {
      const old = letters.find((l) => l.id === editingId);
      const ids = (old && old.photoIds) ? [...old.photoIds] : [];
      for (const src of pending) {
        if (ids.length >= MAX_PHOTOS) break;
        const ref = await addDoc(collection(db, "photos"), { author: me.uid, data: src, createdAt: serverTimestamp() });
        photoCache[ref.id] = src; ids.push(ref.id);
      }
      await updateDoc(doc(db, "letters", editingId), { title, body, photoIds: ids, editedAt: serverTimestamp() });
      pending = []; drawPending();
      toast("고쳤어요"); stopEdit();
    } else {
      if (pending.length) toast("사진을 올리는 중이에요…", 6000);
      const ids = [];
      for (const src of pending) {
        const ref = await addDoc(collection(db, "photos"), { author: me.uid, data: src, createdAt: serverTimestamp() });
        photoCache[ref.id] = src; ids.push(ref.id);
      }
      await addDoc(collection(db, "letters"), { author: me.uid, title, body, photoIds: ids, createdAt: serverTimestamp() });
      $("titleIn").value = ""; $("bodyIn").value = ""; pending = []; drawPending();
      try { localStorage.removeItem(DRAFT); } catch (e) {}
      toast("남겼어요");
    }
  } catch (err) {
    toast(err && err.code === "resource-exhausted"
      ? "오늘 쓸 수 있는 무료 용량을 다 썼어요. 내일 다시 해 보세요."
      : "저장하지 못했어요. 인터넷 연결을 확인해 주세요.");

});

async function fetchPhoto(id) {
  if (photoCache[id] !== undefined) return;
  photoCache[id] = null; // 불러오는 중
  try {
    const s = await getDoc(doc(db, "photos", id));
    photoCache[id] = s.exists() ? s.data().data : "";
  } catch (e) { photoCache[id] = ""; }
  document.querySelectorAll('[data-pid="' + id + '"]').forEach(fillPic);
}
function fillPic(btn) {
  const src = photoCache[btn.dataset.pid];
  if (src) {
    btn.classList.remove("loading");
    let img = btn.querySelector("img");
    if (!img) { img = el("img"); img.alt = "사진"; img.loading = "lazy"; btn.append(img); }
    img.src = src;
    btn.onclick = () => openViewer(src);
  } else if (src === "") {
    btn.classList.remove("loading"); btn.textContent = "사진 없음"; btn.style.cursor = "default";
  } else {
    btn.classList.add("loading");
  }
}

// ---- 화면 그리기 ----
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const openIds = new Set();   // 펼쳐 둔 글
function visibleLetters() {
  if (filter === "me") return letters.filter((l) => l.author === me.uid);
  if (filter === "them") return letters.filter((l) => l.author !== me.uid);
  return letters;
}

  if (items.every((l) => openIds.has(l.id))) items.forEach((l) => openIds.delete(l.id));
  else items.forEach((l) => openIds.add(l.id));

});
function render() {
  if (!me) return;

  // 안 읽은 수
  const newLetters = letters.filter(isNew).length;
  const newReplies = replies.filter(isNew).length;
  const total = newLetters + newReplies;
  $("unreadBadge").textContent = String(total);
  $("unreadBadge").hidden = total === 0;
  document.title = (total ? "(" + total + ") " : "") + "우리 둘의 공책";

  const list = $("list");
  // 다시 그려도 쓰던 답글이 지워지지 않게 보관
  const keep = {}; list.querySelectorAll(".reply-form input").forEach((i) => { if (i.value) keep[i.id] = i.value; });
  const focusId = document.activeElement && document.activeElement.id;
  let items = letters;
  if (filter === "me") items = items.filter((l) => l.author === me.uid);
  if (filter === "them") items = items.filter((l) => l.author !== me.uid);
  list.replaceChildren();
  if (!items.length) {
    $("expandAll").hidden = true;
    list.append(el("div", "empty", !loaded ?"공책을 펼치는 중이에요…" : filter === "all" ? "아직 첫 장이 비어 있어요. 위에 첫 글을 남겨 보세요." : filter === "me" ? "아직 내가 쓴 글이 없어요." : "아직 받은 글이 없어요."));
    return;
  }
  let lastDay = "";
  for (const l of items) {
    const t = tms(l.createdAt), day = fmtDay(t);
    if (day !== lastDay) { list.append(el("div", "day", day)); lastDay = day; }
    const mine = l.author === me.uid;
    const unread = isNew(l);
    const pids = l.photoIds || [];
    const myReplies = replies.filter((r) => r.letterId === l.id);
    const newReply = myReplies.some(isNew);
    const open = openIds.has(l.id);
    const card = el("article", "letter" + (mine ? "" : " them") + (unread ? " unread" : "") + (open ? " open" : ""));

    // 목록 한 줄: 누가·언제 / 제목(없으면 첫 줄) / 사진·답글 수
    const sum = el("button", "sum"); sum.type = "button"; sum.id = "sum-" + l.id;
    sum.setAttribute("aria-expanded", String(open));
    const top = el("span", "sum-top");
    top.append(el("span", "name", nameOf(l.author)), el("span", null, fmtTime(t) + (l.editedAt ? " · 고침" : "")));
    if (unread) top.append(el("span", "chip", "새 글"));
    else if (newReply) top.append(el("span", "chip", "새 답글"));
    const firstLine = (l.body || "").split("\n").find((s) => s.trim()) || "";
    const ttl = el("span", "sum-title" + (l.title ? "" : " plain"), l.title || firstLine || (pids.length ? "사진" : "내용 없음"));
    const info = el("span", "sum-info");
    if (pids.length) info.append(el("span", null, "사진 " + pids.length));
    if (myReplies.length) info.append(el("span", null, "답글 " + myReplies.length));
    const chev = el("span", "chev"); chev.setAttribute("aria-hidden", "true");
    sum.append(top, ttl, info, chev);
    sum.onclick = () => { if (openIds.has(l.id)) openIds.delete(l.id); else openIds.add(l.id); render(); };
    card.append(sum);
    if (!open) { list.append(card); continue; }

    // 펼쳤을 때: 본문 전체, 사진, 답글
    if (l.body) card.append(el("p", "body", l.body));
    if (pids.length) {
      const grid = el("div", "pics" + (pids.length === 1 ? " one" : ""));
      for (const id of pids) {
        const b = el("button", "pic"); b.type = "button"; b.dataset.pid = id; b.setAttribute("aria-label", "사진 크게 보기");
        grid.append(b); fillPic(b); fetchPhoto(id);
      }
      card.append(grid);
    }

    const box = el("div", "replies");
    for (const r of myReplies) {
      const p = el("p", "reply");
      p.append(el("span", "rn", nameOf(r.author)), document.createTextNode(r.text || ""), el("span", "rt", fmtTime(tms(r.createdAt))));
      if (isNew(r)) p.append(el("span", "chip", "새 답글"));
      box.append(p);
    }
    const f = el("form", "reply-form");
    const inp = el("input"); inp.maxLength = 500; inp.placeholder = "짧게 답글 달기"; inp.autocomplete = "off"; inp.id = "reply-" + l.id;
    const btn = el("button", "ghost", "보내기"); btn.type = "submit";
    f.append(inp, btn);
    f.addEventListener("submit", async (e) => {
      e.preventDefault(); const text = inp.value.trim(); if (!text) return;
      btn.disabled = true;
      try { await addDoc(collection(db, "replies"), { letterId: l.id, author: me.uid, text, createdAt: serverTimestamp() }); inp.value = ""; }
      catch (err) { toast("답글을 보내지 못했어요."); }
      btn.disabled = false;
    });
    box.append(f); card.append(box);

    if (mine) {
      if (confirmId === l.id) {
        const c = el("div", "confirm"); c.append("이 글을 지울까요? 되돌릴 수 없어요.");
        const yes = el("button", "ghost danger", "지우기"); yes.type = "button";
        const no = el("button", "ghost", "그만두기"); no.type = "button";
        yes.onclick = async () => {
          confirmId = null;
          try {
            await deleteDoc(doc(db, "letters", l.id));
            for (const id of pids) { try { await deleteDoc(doc(db, "photos", id)); } catch (e) {} }
            toast("지웠어요");
          } catch (e) { toast("지우지 못했어요."); render(); }
        };
        no.onclick = () => { confirmId = null; render(); };
        c.append(yes, no); card.append(c);
      } else {
        const a = el("div", "actions");
        const ed = el("button", "ghost", "고치기"); ed.type = "button"; ed.onclick = () => startEdit(l);
        const del = el("button", "ghost", "지우기"); del.type = "button"; del.onclick = () => { confirmId = l.id; render(); };
        a.append(ed, del); card.append(a);
      }
    }
    list.append(card);
  }
  for (const id in keep) { const i = $(id); if (i) i.value = keep[id]; }
  if (focusId && (focusId.startsWith("reply-") || focusId.startsWith("sum-")) && $(focusId)) $(focusId).focus({ preventScroll: true });
  $("expandAll").textContent = items.length && items.every((l) => openIds.has(l.id)) ? "모두 접기" : "모두 펼치기";
  $("expandAll").hidden = !items.length;
}
</script>
</body>
</html>
